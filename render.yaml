services:
  - type: web
    name: yuzee-ai-lab
    runtime: node
    plan: free
    buildCommand: npm install && SKIP_BGE_CONTRACT=1 npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SKIP_BGE_CONTRACT
        value: "1"
      # Set in the Render dashboard; the built-in defaults are public.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
