# Warehouse intelligence: Neo4j graph + TimesFM forecasting worker (see docs/WAREHOUSE-INTELLIGENCE.md).
#   docker compose -f docker-compose.intelligence.yml up -d neo4j
#   docker compose -f docker-compose.intelligence.yml run --rm worker cache      # once: pinned TimesFM 2.5 weights
#   docker compose -f docker-compose.intelligence.yml run --rm worker pipeline   # export -> IVI refresh -> forecast -> graph
# Requires NEO4J_PASSWORD and YUZEE_WAREHOUSE_DB in .env. Ports are bound to localhost only.
name: yuzee-intelligence
services:
  neo4j:
    # Same Neo4j Community release and digest as Yuzee Dev's deploy/neo4j/neo4j.yaml.
    image: neo4j:5.26.27-community@sha256:937fbd163e302a5751dd329b719c1b05e2a4293af223d61b1aa17e3dea087709
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
      NEO4J_server_https_enabled: "false"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: workers/intelligence
      target: forecast
    profiles: ["worker"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      WAREHOUSE_SQLITE: /warehouse/training_gov.db
      INTELLIGENCE_RUNS: /runs
      HF_HOME: /models
    volumes:
      - type: bind
        source: ${YUZEE_WAREHOUSE_DB:?Set YUZEE_WAREHOUSE_DB in .env}
        target: /warehouse/training_gov.db
        read_only: true
      - ./data/intelligence:/runs
      - timesfm-models:/models
    mem_limit: 6g

volumes:
  neo4j-data:
  timesfm-models:
