<!doctype html><html lang="en"><meta charset="utf-8"><title>BGE candidate checks</title><style>body{font:16px/1.6 system-ui;max-width:950px;margin:40px auto;padding:20px}button{padding:12px 20px}pre{white-space:pre-wrap}</style><h1>BGE candidate checks</h1><p>Tests additional entity context, confusing skill pairs and reuse of an exact browser-generated index. No production settings change.</p><button id="run">Run candidate checks</button><p id="status">Ready</p><pre id="summary"></pre><script type="module">
const b=document.querySelector('#run'),s=document.querySelector('#status');b.onclick=()=>{b.disabled=true;s.textContent='Running';const w=new Worker(new URL('./extra.worker.ts',import.meta.url),{type:'module'});w.onmessage=async(e)=>{if(e.data.type==='result'){const r=e.data.result;const saved=await fetch('http://127.0.0.1:3001/record/browser-extra',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});document.querySelector('#summary').textContent=JSON.stringify({saved:saved.ok,summary:r.summary,startup:r.cacheExperiment},null,2);s.textContent=saved.ok?'Complete; saved locally':'Save failed';}else{s.textContent=e.data.message;}w.terminate();b.disabled=false;};w.onerror=e=>{s.textContent=e.message;w.terminate();b.disabled=false;};w.postMessage({type:'run'});};
</script></html>
